---
# Inventory for the disposable test container started by tools/container_test.py.
# Values here describe the container, not the real MagicBox. Shared defaults
# come from group_vars/magicbox/main.yml (a symlink to the real group vars);
# overrides are host vars because they must win over group_vars files.
all:
  children:
    magicbox:
      hosts:
        magicbox-test:
          ansible_connection: community.docker.docker
          ansible_host: magicbox-test
          ansible_python_interpreter: /usr/bin/python3
          magicbox_expected_architecture: "{{ ansible_facts['architecture'] }}"
          preflight_manage_hostname: false
          magicbox_lan_interface: eth0
          magicbox_lan_cidr: 172.16.0.0/12
          # Test-only credential for the throwaway container; never reuse it.
          vault_portainer_admin_password: container-test-only-pw
          vault_postgresql_password: container-test-only-pg
          vault_rabbitmq_password: container-test-only-mq
          vault_grafana_admin_password: container-test-only-gf
          vault_jenkins_admin_password: container-test-only-jk
          vault_kong_ollama_api_key: container-test-only-kg
          vault_rustfs_access_key: container-test-only-s3
          vault_rustfs_secret_key: container-test-only-s3-secret
          # Apps registry for --with-apps (placeholder repository, never scanned
          # successfully: the container test has no GitHub token).
          magicbox_apps:
            - name: tester-app
              port: 18001
              repo: https://github.com/example/magicbox-tester-app
