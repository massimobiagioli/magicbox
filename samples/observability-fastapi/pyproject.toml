[project]
name = "observability-fastapi"
version = "0.1.0"
description = "MagicBox sample: structured JSON logs shipped by Alloy to Loki, explored in Grafana"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
