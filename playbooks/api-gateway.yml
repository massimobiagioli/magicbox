---
# API gateway: Kong (DB-less) deployed as the Portainer stack "kong" in the
# site environment (ADR-0015). Requires playbooks/site.yml (ports 80/443 in
# ufw). Routes /portainer, /jenkins, /grafana, /rabbitmq, /ollama and the apps
# of the registry (magicbox_apps, inventory/group_vars/magicbox/apps.yml).
# Run: make api-gateway
- name: Deploy the API gateway stack (Kong) through Portainer
  hosts: magicbox
  become: true
  gather_facts: false
  vars:
    stacks_enabled: [kong]
  roles:
    - role: stacks
      tags: [api-gateway]
