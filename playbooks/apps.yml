---
# Registers the apps of the registry (magicbox_apps in the git-ignored
# inventory/group_vars/magicbox/apps.yml; template inventory/apps.example.yml):
# Kong route https://magicbox.local/<name> -> 127.0.0.1:<port> and Jenkins
# Multibranch Pipeline <name> (ADR-0016, ADR-0017). The pipelines deploy the
# apps. Requires make ci-cd and make api-gateway.
# Run: make apps
- name: Register the apps in the API gateway (Kong) and in Jenkins
  hosts: magicbox
  become: true
  gather_facts: false
  vars:
    stacks_enabled: [kong]
  roles:
    - role: stacks
      tags: [apps]
  tasks:
    - name: Create the Jenkins jobs of the apps
      ansible.builtin.include_role:
        name: stacks
        tasks_from: apps_jenkins
      tags: [apps]

    - name: Report the registered apps
      ansible.builtin.include_role:
        name: stacks
        tasks_from: apps_report
      tags: [apps]
