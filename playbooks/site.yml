---
# MagicBox, the whole infrastructure in one idempotent run (ADR-0021): host,
# Docker, Portainer (https://magicbox.local:9443/), every stack in
# stacks_enabled, the apps registry (Kong routes, Jenkins jobs).
# Run: make deploy
- name: Configure MagicBox
  hosts: magicbox
  become: true
  gather_facts: true
  roles:
    - role: preflight
      tags: [preflight, always]
    - role: mdns
      tags: [mdns]
    - role: firewall
      tags: [firewall]
    - role: docker
      tags: [docker]
    - role: portainer
      tags: [portainer]
    - role: portainer_init
      tags: [portainer, portainer-init]

- name: Verify Portainer from the Ansible controller
  hosts: magicbox
  become: false
  gather_facts: false
  tags: [verify, controller-verify]
  vars:
    controller_ca_path: >-
      {{ (portainer_tls_mode | default('local_ca') == 'local_ca')
         | ternary(playbook_dir ~ '/../artifacts/magicbox-local-ca.crt', portainer_tls_provided_ca_src | default('')) }}
  tasks:
    - name: Query Portainer over the LAN using magicbox.local and the trusted CA
      ansible.builtin.uri:
        url: "https://{{ magicbox_hostname }}.local:{{ portainer_https_port | default(9443) }}/api/system/status"
        ca_path: "{{ controller_ca_path }}"
        validate_certs: true
      delegate_to: localhost
      register: controller_portainer_status
      retries: 5
      delay: 3
      until: controller_portainer_status.status == 200

# Default stacks, Jenkins, Kong (with the app routes), RustFS, registry
# (ADR-0011, 0014, 0015, 0018, 0020), as Portainer stacks in the site
# environment (magicbox_site_name).
- name: Deploy the stacks through Portainer
  hosts: magicbox
  become: true
  gather_facts: false
  roles:
    - role: stacks
      tags: [stacks]

# Apps registry (magicbox_apps in the git-ignored
# inventory/group_vars/magicbox/apps.yml; template inventory/apps.example.yml):
# Kong routes are deployed with the kong stack above; here apps.json and one
# Jenkins Multibranch Pipeline per app, whose pipeline deploys the app
# (ADR-0016, ADR-0017).
- name: Register the apps in Jenkins
  hosts: magicbox
  become: true
  gather_facts: false
  tags: [apps]
  tasks:
    - name: Create the Jenkins jobs of the apps and report them
      ansible.builtin.include_role:
        name: stacks
        tasks_from: apps
