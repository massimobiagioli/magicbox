---
# Template for inventory/group_vars/magicbox/vault.yml (kept outside
# group_vars so Ansible never loads it as real variables).
# Create or edit the real (encrypted) file with:
#   make vault-edit
# and set the keys below with a strong, unique value (minimum 12 characters).
# The real vault.yml is git-ignored; never commit a plaintext password.
vault_portainer_admin_password: ""

# sudo password of ansible_user on MagicBox (used as ansible_become_password).
vault_become_password: ""

# Default stacks (playbooks/stacks.yml); each at least 12 characters.
vault_postgresql_password: ""
vault_rabbitmq_password: ""
vault_grafana_admin_password: ""

# CI/CD (playbooks/ci-cd.yml). Admin password required (at least 12 characters);
# the tokens are optional (leave empty until created, see the installation guide).
vault_jenkins_admin_password: ""
vault_jenkins_github_token: ""
vault_jenkins_portainer_token: ""
