---
# Copy to inventory/hosts.yml (git-ignored) and replace every value marked
# REQUIRED with facts from your environment. Do not commit the real file.
all:
  children:
    magicbox:
      hosts:
        magicbox-node:
          # MagicBox is always addressed by its mDNS name; the IP is dynamic
          # (DHCP). Avahi is installed during the manual steps so this name
          # resolves before the first playbook run.
          ansible_host: magicbox.local
          # REQUIRED: the sudo-capable admin account created during OS install.
          ansible_user: CHANGE_ME
          # Dedicated SSH key created in the installation guide (1.6).
          ansible_ssh_private_key_file: ~/.ssh/magicbox/id_ed25519
          # Connect over IPv4: the firewall allows SSH only from magicbox_lan_cidr
          # (IPv4), and macOS may still resolve magicbox.local to an IPv6
          # link-local address.
          ansible_ssh_extra_args: "-4"
          # sudo password, read from the vault (vault_become_password).
          # Remove this line if ansible_user has passwordless sudo.
          ansible_become_password: "{{ vault_become_password }}"
          # Ubuntu 26.04 only: sudo is sudo-rs, whose prompt Ansible cannot
          # answer; use the classic sudo shipped as sudo.ws (ADR-0002).
          # ansible_become_exe: sudo.ws
      vars:
        # REQUIRED: the LAN interface name on MagicBox (`ip -br link`).
        magicbox_lan_interface: CHANGE_ME
        # REQUIRED: the IPv4 LAN subnet allowed to reach SSH and Portainer
        # (e.g. 192.168.1.0/24). It is the subnet, not MagicBox's address.
        magicbox_lan_cidr: CHANGE_ME
        # Optional (make ci-cd): GitHub user that owns vault_jenkins_github_token.
        # stacks_jenkins_github_user: CHANGE_ME
