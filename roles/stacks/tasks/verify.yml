---
# Portainer deploys asynchronously; first deployments include image pulls
# (Ollama alone is about 3.4 GB), hence the 15-minute budget.
- name: Wait for the stack containers
  block:
    - name: Wait until every stack container is running (and healthy when it has a healthcheck)
      community.docker.docker_container_info:
        name: "{{ item }}"
      loop: "{{ stacks_enabled | map('extract', stacks_containers) | flatten }}"
      register: stacks_container_info
      retries: 150
      delay: 6
      until:
        - stacks_container_info.exists
        - stacks_container_info.container.State.Running
        - (stacks_container_info.container.State.Health | default({})).Status | default('healthy') == 'healthy'
  rescue:
    - name: Collect the state of every stack container
      ansible.builtin.command:
        argv: [docker, ps, --all, --format, "{{ '{{.Names}}: {{.Status}}' }}"]
      register: stacks_diag_ps
      changed_when: false

    - name: Collect the last log lines of each stack container
      ansible.builtin.command:
        argv: [docker, logs, --tail, "30", "{{ item }}"]
      loop: "{{ stacks_enabled | map('extract', stacks_containers) | flatten }}"
      register: stacks_diag_logs
      changed_when: false
      failed_when: false

    - name: Report why the stack containers are not ready
      ansible.builtin.fail:
        msg: |-
          Stack containers not ready. Containers:
          {{ stacks_diag_ps.stdout }}
          {% for r in stacks_diag_logs.results %}
          --- {{ r.item }} (last 30 lines) ---
          {{ ((r.stdout ~ '\n' ~ r.stderr) | trim) or 'container not found (check the stack in Portainer)' }}
          {% endfor %}

- name: Check PostgreSQL accepts connections
  community.docker.docker_container_exec:
    container: postgresql
    argv: [pg_isready, -U, "{{ stacks_postgresql_user }}", -d, "{{ stacks_postgresql_database }}"]
  changed_when: false
  when: "'postgresql' in stacks_enabled"

- name: Check the RabbitMQ management API with the vault credentials
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ stacks_rabbitmq_management_port }}/api/overview"
    url_username: "{{ stacks_rabbitmq_user }}"
    url_password: "{{ stacks_rabbitmq_password }}"
    force_basic_auth: true
  when: "'rabbitmq' in stacks_enabled"
  no_log: true

- name: Check the Ollama API
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ stacks_ollama_port }}/api/version"
  when: "'ollama' in stacks_enabled"

- name: Check Grafana over HTTPS with the MagicBox CA
  ansible.builtin.uri:
    url: "https://{{ magicbox_hostname }}.local:{{ stacks_grafana_port }}/api/health"
    ca_path: "{{ magicbox_portainer_ca_cert }}"
  register: stacks_grafana_health
  retries: 20
  delay: 3
  until: stacks_grafana_health.status == 200
  when: "'observability' in stacks_enabled"

- name: Check that Loki receives container logs shipped by Alloy (via Grafana)
  ansible.builtin.uri:
    url: "https://{{ magicbox_hostname }}.local:{{ stacks_grafana_port }}/api/datasources/proxy/uid/loki/loki/api/v1/label/container/values"
    ca_path: "{{ magicbox_portainer_ca_cert }}"
    url_username: admin
    url_password: "{{ stacks_grafana_admin_password }}"
    force_basic_auth: true
  register: stacks_loki_containers
  retries: 30
  delay: 5
  until:
    - stacks_loki_containers.status == 200
    - "'loki' in (stacks_loki_containers.json.data | default([]))"
  when: "'observability' in stacks_enabled"
  no_log: true

- name: Check Jenkins over HTTPS with the MagicBox CA and the admin login
  ansible.builtin.uri:
    url: "https://{{ magicbox_hostname }}.local:{{ stacks_jenkins_port }}/whoAmI/api/json"
    ca_path: "{{ magicbox_portainer_ca_cert }}"
    url_username: admin
    url_password: "{{ stacks_jenkins_admin_password }}"
    force_basic_auth: true
  register: stacks_jenkins_whoami
  retries: 40
  delay: 5
  until:
    - stacks_jenkins_whoami.status == 200
    - stacks_jenkins_whoami.json.authenticated | default(false)
  when: "'jenkins' in stacks_enabled"
  no_log: true

- name: Check Jenkins refuses anonymous access
  ansible.builtin.uri:
    url: "https://{{ magicbox_hostname }}.local:{{ stacks_jenkins_port }}/api/json"
    ca_path: "{{ magicbox_portainer_ca_cert }}"
    status_code: [401, 403]
  when: "'jenkins' in stacks_enabled"

- name: Check the Jenkins build agent is online
  ansible.builtin.uri:
    url: "https://{{ magicbox_hostname }}.local:{{ stacks_jenkins_port }}/computer/docker-agent/api/json"
    ca_path: "{{ magicbox_portainer_ca_cert }}"
    url_username: admin
    url_password: "{{ stacks_jenkins_admin_password }}"
    force_basic_auth: true
  register: stacks_jenkins_agent
  retries: 30
  delay: 5
  until:
    - stacks_jenkins_agent.status == 200
    - not (stacks_jenkins_agent.json.offline | default(true))
  when: "'jenkins' in stacks_enabled"
  no_log: true

- name: Check the Jenkins agent can use the MagicBox Docker engine as user jenkins
  community.docker.docker_container_exec:
    container: jenkins-agent
    argv: [su, jenkins, -c, "docker version --format '{{ '{{' }}.Server.Version{{ '}}' }}'"]
  changed_when: false
  when: "'jenkins' in stacks_enabled"
