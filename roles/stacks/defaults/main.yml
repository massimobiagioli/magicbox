---
# Stacks deployed into the Portainer site environment (magicbox_site_name).
# Removing a name here does NOT delete the stack; delete it in Portainer.
stacks_enabled:
  - rabbitmq
  - postgresql
  - ollama
  - observability

# Host directory for configuration files mounted into stack containers.
stacks_base_dir: /opt/magicbox/stacks

# Images, pinned to exact tags (checked on Docker Hub 2026-10-28).
stacks_rabbitmq_image: rabbitmq:4.3.7-management
stacks_postgresql_image: postgres:18.6
stacks_ollama_image: ollama/ollama:0.40.12
# Open WebUI, slim variant: no local embedding/RAG stack (ADR-0019; checked on
# GitHub releases 2026-10-30).
stacks_openwebui_image: ghcr.io/open-webui/open-webui:v0.12.5-slim
stacks_grafana_image: grafana/grafana:13.2.5
stacks_loki_image: grafana/loki:3.7.9
stacks_alloy_image: grafana/alloy:v1.21.2

# Host ports published to the LAN (filtered by the DOCKER-USER chain).
stacks_rabbitmq_amqp_port: 5672
stacks_rabbitmq_management_port: 15672
stacks_postgresql_port: 5432
stacks_ollama_port: 11434
stacks_grafana_port: 3000
# Open WebUI (HTTPS, MagicBox certificate); /openwebui on the gateway redirects here.
stacks_openwebui_port: 8444

# Credentials. Passwords come from the vault and are applied only when the
# service initialises its data volume for the first time.
stacks_rabbitmq_user: magicbox
stacks_rabbitmq_password: "{{ vault_rabbitmq_password | default('') }}"
stacks_postgresql_user: magicbox
stacks_postgresql_database: magicbox
stacks_postgresql_password: "{{ vault_postgresql_password | default('') }}"
stacks_grafana_admin_password: "{{ vault_grafana_admin_password | default('') }}"
# Open WebUI admin, created on first start only (empty database); sign-up is
# then disabled. The e-mail is only the login name.
stacks_openwebui_admin_email: admin@magicbox.local
stacks_openwebui_admin_password: "{{ vault_openwebui_admin_password | default('') }}"
# Signs the Open WebUI sessions; changing it logs everyone out.
stacks_openwebui_secret_key: "{{ vault_openwebui_secret_key | default('') }}"

# Ollama models pulled after deployment (e.g. ["llama3.2:3b"]). Pulls can
# take a long time and several GB of disk; models are never deleted.
stacks_ollama_models: []

# Loki log retention.
stacks_loki_retention: 168h

# --- Jenkins CI/CD stack (playbooks/ci-cd.yml; not in stacks_enabled by default) ---
# Base images, pinned (checked on Docker Hub 2026-10-29). The controller and
# agent images are built on MagicBox from these (ADR-0014).
stacks_jenkins_image: jenkins/jenkins:2.580.2-lts-jdk21
stacks_jenkins_agent_base_image: jenkins/ssh-agent:9.3.1-jdk21
stacks_jenkins_docker_cli_image: docker:29.9.2-cli
stacks_jenkins_uv_image: ghcr.io/astral-sh/uv:0.13.6

# Plugins baked into the controller image, pinned for core 2.580.2 (Jenkins
# update center, 2026-10-29). Dependencies are resolved by jenkins-plugin-cli.
stacks_jenkins_plugins:
  configuration-as-code: 2140.v00e72b_047734
  workflow-aggregator: 608.v67378e9d3db_1
  pipeline-stage-view: "2.41"
  git: 5.11.0
  github-branch-source: 1986.v801e40614d00
  credentials-binding: 728.v902a_273b_8947
  ssh-slaves: 3.1097.v868116049892
  docker-workflow: 653.v2f2c08eff0ec
  timestamper: "1.30"
  ws-cleanup: "0.49"
  # App jobs created from the apps registry by `make apps` (ADR-0017).
  job-dsl: 3732.v9a_c49a_61a_313

# HTTPS port of the Jenkins UI on the LAN (same certificate as Portainer).
stacks_jenkins_port: 8443

# Resource limits: Jenkins shares MagicBox with the other stacks.
stacks_jenkins_heap: 1g
stacks_jenkins_memory_limit: 2g
stacks_jenkins_agent_memory_limit: 4g
stacks_jenkins_agent_executors: 2

# Credentials. The admin password is required; the tokens are optional and
# become Jenkins credentials `github` and `portainer-api-token` when set.
stacks_jenkins_admin_password: "{{ vault_jenkins_admin_password | default('') }}"
stacks_jenkins_github_user: ""
stacks_jenkins_github_token: "{{ vault_jenkins_github_token | default('') }}"
stacks_jenkins_portainer_token: "{{ vault_jenkins_portainer_token | default('') }}"

# Branch indexing interval of the app jobs (GitHub is polled, ADR-0014).
stacks_jenkins_scan_interval: 5m

# --- Kong API gateway stack (playbooks/api-gateway.yml; not in stacks_enabled by default) ---
# Kong OSS in DB-less mode, pinned (checked on Docker Hub 2026-10-29; 3.9 is
# the last open-source line of Kong Gateway, ADR-0015).
stacks_kong_image: kong:3.9.4

# Host ports (host networking): HTTP only redirects to HTTPS. Both must be in
# firewall_lan_tcp_ports (firewall role, playbooks/site.yml).
stacks_kong_http_port: 80
stacks_kong_https_port: 443

# Seconds Kong waits for an upstream (long Ollama generations, Portainer
# console, image pulls through the Portainer UI).
stacks_kong_upstream_timeout: 600

# API key required on /ollama (header or query parameter `apikey`).
stacks_kong_ollama_api_key: "{{ vault_kong_ollama_api_key | default('') }}"

# --- RustFS object storage stack (playbooks/storage.yml; not in stacks_enabled by default) ---
# S3-compatible object storage with a web console (ADR-0018), pinned (checked
# on GitHub releases 2026-10-30).
stacks_rustfs_image: rustfs/rustfs:1.0.4
# Host ports, HTTPS with the MagicBox certificate. Not the upstream 9000/9001:
# port 9000 stays closed (Portainer legacy HTTP, CONSTITUTION).
stacks_rustfs_api_port: 9100
stacks_rustfs_console_port: 9101
# Root credentials, applied at every start (rotation keeps the data).
stacks_rustfs_access_key: "{{ vault_rustfs_access_key | default('') }}"
stacks_rustfs_secret_key: "{{ vault_rustfs_secret_key | default('') }}"

# --- Apps (playbooks/apps.yml, ADR-0016/0017) ---
# Host directory with apps.json (name -> port), read by the app pipelines.
stacks_apps_dir: /opt/magicbox/apps
