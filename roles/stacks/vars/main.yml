---
# Environment passed to each Portainer stack. Secrets live here (resolved
# from the vault), never in the compose files.
stacks_env:
  rabbitmq:
    RABBITMQ_DEFAULT_USER: "{{ stacks_rabbitmq_user }}"
    RABBITMQ_DEFAULT_PASS: "{{ stacks_rabbitmq_password }}"
  postgresql:
    POSTGRES_USER: "{{ stacks_postgresql_user }}"
    POSTGRES_PASSWORD: "{{ stacks_postgresql_password }}"
    POSTGRES_DB: "{{ stacks_postgresql_database }}"
  ollama: {}
  observability:
    GF_SECURITY_ADMIN_PASSWORD: "{{ stacks_grafana_admin_password }}"
  # Jenkins reads its secrets from files (config_jenkins.yml), not from env.
  jenkins: {}
  # Kong reads its declarative configuration (with the API key) from a file.
  kong: {}

# Passwords each stack needs (checked before deployment).
stacks_required_secrets:
  rabbitmq: [stacks_rabbitmq_password]
  postgresql: [stacks_postgresql_password]
  ollama: []
  observability: [stacks_grafana_admin_password]
  jenkins: [stacks_jenkins_admin_password]
  kong: [stacks_kong_ollama_api_key]

# Containers created by each stack (used by verification).
stacks_containers:
  rabbitmq: [rabbitmq]
  postgresql: [postgresql]
  ollama: [ollama]
  observability: [loki, alloy, grafana]
  jenkins: [jenkins, jenkins-agent]
  kong: [kong]

stacks_images:
  rabbitmq: ["{{ stacks_rabbitmq_image }}"]
  postgresql: ["{{ stacks_postgresql_image }}"]
  ollama: ["{{ stacks_ollama_image }}"]
  observability: ["{{ stacks_loki_image }}", "{{ stacks_alloy_image }}", "{{ stacks_grafana_image }}"]
  jenkins: ["{{ stacks_jenkins_controller_image }}", "{{ stacks_jenkins_agent_image }}"]
  kong: ["{{ stacks_kong_image }}"]

# Jenkins images built on MagicBox. The tag carries a hash of the build files,
# so changing a base image, plugin or script yields a new tag, a new build and
# a redeploy of the stack.
stacks_jenkins_build_tag: >-
  {{ (lookup('ansible.builtin.template', 'jenkins/controller.Dockerfile.j2')
      ~ lookup('ansible.builtin.template', 'jenkins/plugins.txt.j2')
      ~ lookup('ansible.builtin.template', 'jenkins/agent.Dockerfile.j2')
      ~ lookup('ansible.builtin.template', 'jenkins/agent-entrypoint.sh.j2'))
     | hash('sha256') | truncate(12, true, '') }}
stacks_jenkins_controller_image: "magicbox/jenkins:{{ stacks_jenkins_build_tag }}"
stacks_jenkins_agent_image: "magicbox/jenkins-agent:{{ stacks_jenkins_build_tag }}"

# Jenkins runs as UID 1000 in both images.
stacks_jenkins_uid: "1000"

# Password of the PKCS#12 keystore holding the TLS key for Jenkins. Not a
# secret on its own: the keystore file is readable only by Jenkins (mode 0400),
# and the same key is already on disk for Portainer.
stacks_jenkins_keystore_password: magicbox-jenkins-tls

# API gateway routes (ADR-0015): https://<host>.local/<path> -> upstream on
# 127.0.0.1 (Kong uses host networking). `strip`: the service serves from /,
# so the path is removed before forwarding; the others serve from the same
# sub-path on their own port too. `container` gates the verification check.
stacks_kong_routes:
  - name: portainer
    path: /portainer/
    url: "https://127.0.0.1:{{ magicbox_portainer_api_url | urlsplit('port') }}"
    strip: true
    preserve_host: true
    check: /portainer/api/system/status
    container: kong
  - name: jenkins
    path: /jenkins
    url: "https://127.0.0.1:{{ stacks_jenkins_port }}"
    strip: false
    preserve_host: true
    check: /jenkins/login
    container: jenkins
  - name: grafana
    path: /grafana
    url: "https://127.0.0.1:{{ stacks_grafana_port }}"
    strip: false
    preserve_host: true
    check: /grafana/api/health
    container: grafana
  - name: rabbitmq
    path: /rabbitmq
    url: "http://127.0.0.1:{{ stacks_rabbitmq_management_port }}"
    strip: false
    preserve_host: true
    check: /rabbitmq/
    container: rabbitmq
  # Ollama has no UI and no authentication: the gateway requires an API key.
  - name: ollama
    path: /ollama/
    url: "http://127.0.0.1:{{ stacks_ollama_port }}"
    strip: true
    preserve_host: false
    check: /ollama/api/version
    container: ollama
    key_auth: true
