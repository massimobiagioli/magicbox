---
# SSH port allowed from the LAN. Change only if sshd listens elsewhere.
firewall_ssh_port: 22

# TCP ports allowed from magicbox_lan_cidr in addition to SSH.
firewall_lan_tcp_ports:
  - 9443  # Portainer HTTPS UI/API

# UDP ports allowed from magicbox_lan_cidr.
firewall_lan_udp_ports:
  - 5353  # mDNS (Avahi)

firewall_logging: low

# Filter ports published by Docker containers. Docker's NAT rules bypass the
# ufw INPUT rules, so a DOCKER-USER chain (loaded by ufw from after.rules)
# admits new connections from magicbox_lan_cidr only (ADR-0012).
firewall_docker_user_filter: true
