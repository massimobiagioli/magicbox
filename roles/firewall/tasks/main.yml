---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Read the current ufw status
  ansible.builtin.command:
    argv: [ufw, status]
  register: firewall_status
  changed_when: false

- name: Refuse first-time firewall activation without explicit confirmation
  ansible.builtin.assert:
    that:
      - magicbox_confirm_destructive | bool
    fail_msg: >-
      ufw is inactive. Enabling it drops every inbound connection not coming from
      {{ magicbox_lan_cidr }} (controller location: {{ preflight_controller_location }}).
      Confirm SSH access from that subnet, then re-run with -e magicbox_confirm_destructive=true.
    quiet: true
  when: "'Status: active' not in firewall_status.stdout"

- name: Refuse to enable the firewall when the controller is outside the LAN
  ansible.builtin.assert:
    that:
      - preflight_controller_location != 'outside'
    fail_msg: >-
      The SSH connection originates outside {{ magicbox_lan_cidr }}; enabling ufw would
      lock this controller out. Fix magicbox_lan_cidr or run from inside the LAN.
    quiet: true

- name: Allow SSH from the LAN
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: "{{ magicbox_lan_cidr }}"
    to_port: "{{ firewall_ssh_port | string }}"
    comment: magicbox-ssh

- name: Allow LAN TCP services
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: "{{ magicbox_lan_cidr }}"
    to_port: "{{ item | string }}"
    comment: "magicbox-tcp-{{ item }}"
  loop: "{{ firewall_lan_tcp_ports }}"

- name: Allow LAN UDP services
  community.general.ufw:
    rule: allow
    proto: udp
    from_ip: "{{ magicbox_lan_cidr }}"
    to_port: "{{ item | string }}"
    comment: "magicbox-udp-{{ item }}"
  loop: "{{ firewall_lan_udp_ports }}"

- name: Deny all other inbound traffic by default
  community.general.ufw:
    direction: incoming
    default: deny

- name: Allow outbound traffic by default
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Set firewall logging level
  community.general.ufw:
    logging: "{{ firewall_logging }}"

- name: Restrict Docker-published ports to the LAN (DOCKER-USER chain)
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    marker: "# {mark} MAGICBOX DOCKER-USER (managed by Ansible, role: firewall)"
    block: |
      *filter
      :DOCKER-USER - [0:0]
      -A DOCKER-USER -m conntrack --ctstate RELATED,ESTABLISHED -j RETURN
      -A DOCKER-USER -i {{ magicbox_lan_interface }} -s {{ magicbox_lan_cidr }} -j RETURN
      -A DOCKER-USER -i {{ magicbox_lan_interface }} -j DROP
      -A DOCKER-USER -j RETURN
      COMMIT
    state: "{{ firewall_docker_user_filter | ternary('present', 'absent') }}"
  notify: Reload ufw

- name: Enable ufw (persists across reboots)
  community.general.ufw:
    state: enabled

- name: Apply pending firewall changes before verification
  ansible.builtin.meta: flush_handlers

- name: Read the DOCKER-USER chain
  ansible.builtin.command:
    argv: [iptables, -S, DOCKER-USER]
  register: firewall_docker_user_rules
  changed_when: false
  when: firewall_docker_user_filter | bool
  tags: [verify]

- name: Assert published container ports are limited to the LAN
  ansible.builtin.assert:
    that:
      - >-
        ("-A DOCKER-USER -s " ~ magicbox_lan_cidr ~ " -i " ~ magicbox_lan_interface ~ " -j RETURN")
        in firewall_docker_user_rules.stdout_lines
      - ("-A DOCKER-USER -i " ~ magicbox_lan_interface ~ " -j DROP") in firewall_docker_user_rules.stdout_lines
    fail_msg: "DOCKER-USER does not restrict published ports to {{ magicbox_lan_cidr }}."
    quiet: true
  when: firewall_docker_user_filter | bool
  tags: [verify]
