---
# Shared by the stacks role (include_role tasks_from: api_login).
- name: Log in to the Portainer API
  ansible.builtin.uri:
    url: "{{ magicbox_portainer_api_url }}/api/auth"
    method: POST
    ca_path: "{{ magicbox_portainer_ca_cert }}"
    body_format: json
    body:
      username: "{{ portainer_init_api_user }}"
      password: "{{ portainer_admin_password }}"
    status_code: [200, 422]
  register: portainer_init_auth
  retries: 10
  delay: 3
  until: portainer_init_auth.status in [200, 422]
  no_log: true

- name: Fail with guidance when Portainer rejects the vault password
  ansible.builtin.fail:
    msg: >-
      Portainer rejected the vault password for '{{ portainer_init_api_user }}'. It was probably
      changed in the UI; update vault_portainer_admin_password to the current password.
  when: portainer_init_auth.status != 200

- name: Store the API token for this play
  ansible.builtin.set_fact:
    portainer_init_jwt: "{{ portainer_init_auth.json.jwt }}"
  no_log: true
